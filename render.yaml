# ============================================================
#  RENDER DEPLOY AYARLARI
#  Render'da "Blueprint" olarak bu dosyayı seçersem backend'i ve
#  veritabanını ayarlarıyla birlikte otomatik kurar.
#  (Elle kurmak istersem README'deki adımlar da aynı sonucu verir.)
# ============================================================
services:
  - type: web
    name: trello-clone-backend
    runtime: node
    plan: free
    # Backend alt klasörde olduğu için komutları oradan çalıştırıyorum
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Render sunucunun ayakta olup olmadığını buradan kontrol eder
    healthCheckPath: /health
    envVars:
      # Veritabanı adresini aşağıdaki veritabanından otomatik alıyor
      - key: DATABASE_URL
        fromDatabase:
          name: trello-clone-db
          property: connectionString
      # Token imzalama anahtarını Render rastgele üretsin (koda yazmıyorum)
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: trello-clone-db
    plan: free
    databaseName: trello
